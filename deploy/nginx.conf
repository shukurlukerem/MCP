# nginx site for the MCP Automation Service.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mcp
#   sudo ln -s /etc/nginx/sites-available/mcp /etc/nginx/sites-enabled/mcp
#   sudo certbot --nginx -d mcp.sabahhub.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream mcp_api {
    # One entry per api container. ip_hash keeps a client pinned to the same
    # node — MCP SSE sessions are held in that process's memory.
    ip_hash;
    server 127.0.0.1:8000;
    # server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name mcp.sabahhub.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mcp.sabahhub.com;

    # certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/mcp.sabahhub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.sabahhub.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # The internal API is service-to-service only. Restrict it to the SABAH.OS
    # host in addition to the X-Internal-Key check the app performs.
    location /internal/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://mcp_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP stream — buffering off, long timeouts, no chunk coalescing.
    location /mcp/ {
        proxy_pass http://mcp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        proxy_pass http://mcp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
